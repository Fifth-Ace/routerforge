name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect expensive build changes
        id: changes
        shell: bash
        run: |
          set -eu

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          case "$BASE" in
            ""|0000000000000000000000000000000000000000)
              BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
              ;;
          esac

          git diff --name-only "$BASE" "$GITHUB_SHA" \
            > /tmp/routerforge-changed-files.txt

          cat /tmp/routerforge-changed-files.txt

          expensive=false

          while IFS= read -r path; do
            case "$path" in
              components/*|modules/*|marketplace/*|release/*|scripts/*|go.mod|go.sum|.github/workflows/ci.yml)
                expensive=true
                break
                ;;
            esac
          done < /tmp/routerforge-changed-files.txt

          echo "expensive=$expensive" >> "$GITHUB_OUTPUT"
          echo "Expensive build required: $expensive"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install frontend dependencies
        working-directory: components/core/frontend
        run: npm install --no-audit --no-fund

      - name: Check frontend
        working-directory: components/core/frontend
        run: npm run check

      - name: Build frontend
        working-directory: components/core/frontend
        run: npm run build

      - name: Verify frontend build
        run: |
          test -f components/core/frontend/build/index.html
          test -d components/core/frontend/build/_app
          test -f components/core/frontend/build/favicon.ico
          test -f components/core/frontend/build/routerforge-mark.png

      - name: Install DNS frontend dependencies
        working-directory: modules/dns/frontend
        run: npm install --no-audit --no-fund

      - name: Build DNS frontend
        working-directory: modules/dns/frontend
        run: npm run build

      - name: Verify DNS frontend build
        run: test -f modules/dns/frontend/build/index.html

      - name: Validate RouterForge registry
        run: python3 marketplace/build_registry.py --check

      - name: Verify repository layout
        run: |
          test -z "$(find . -maxdepth 1 -type f -name '*.go' -print)"
          test ! -d cmd
          test ! -d frontend
          test ! -d packaging
          test -f components/core/main.go
          test -f components/control/main.go
          test -f modules/dns/runtime/dns_module_main.go
          test -f modules/dns/frontend/DNSModuleApp.svelte
          test -f modules/monitoring-runtime/main.go
          test -f modules/system/packaging/S92routerforge-system
          test -f modules/thermal/packaging/S93routerforge-thermal
          test -f modules/storage/packaging/S94routerforge-storage
          test -f modules/network/packaging/S95routerforge-network
          test -f release/channels/beta.json
          test -f release/channels/stable.json
          test -f docs/REPOSITORY_LAYOUT.md


      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: true

      - name: Install pinned UPX
        if: steps.changes.outputs.expensive == 'true'
        run: |
          set -eu
          UPX_VERSION=5.2.1
          UPX_ARCHIVE="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          UPX_SHA256="402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657"
          UPX_URL="https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_ARCHIVE}"

          curl --fail --silent --show-error --location \
            "$UPX_URL" \
            --output "/tmp/$UPX_ARCHIVE"

          printf '%s  %s\n' \
            "$UPX_SHA256" \
            "/tmp/$UPX_ARCHIVE" |
            sha256sum -c -

          rm -rf "/tmp/upx-${UPX_VERSION}-amd64_linux"
          tar -xJf "/tmp/$UPX_ARCHIVE" -C /tmp

          sudo install -m 0755 \
            "/tmp/upx-${UPX_VERSION}-amd64_linux/upx" \
            /usr/local/bin/upx

          test "$(upx --version | head -n 1)" = "upx 5.2.1"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Verify embedded frontend build
        if: steps.changes.outputs.expensive == 'true'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -tags embed_frontend \
            -ldflags="-X main.version=0.0.0-ci" \
            -o /tmp/routerforge-embed-check ./components/core
          test -s /tmp/routerforge-embed-check

      - name: Verify monitoring provider cross-build
        if: steps.changes.outputs.expensive == 'true'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-X main.version=0.0.0-ci" \
            -o /tmp/routerforge-module-arm64 ./modules/monitoring-runtime
          test -s /tmp/routerforge-module-arm64

      - name: Verify planned MIPS build targets
        if: steps.changes.outputs.expensive == 'true'
        run: |
          set -eu
          for target in mips-3.4 mipsel-3.4; do
            ROUTERFORGE_TARGET="$target" ./scripts/build-opkg.sh 0.0.0-ci
            ROUTERFORGE_TARGET="$target" ./scripts/build-admin-opkg.sh 0.0.0-ci
            ROUTERFORGE_TARGET="$target" ./scripts/build-module-opkg.sh dns 0.0.0-ci
            ROUTERFORGE_TARGET="$target" ./scripts/build-module-opkg.sh system 0.0.0-ci

            test -s "dist/routerforge-core_0.0.0-ci_${target}.ipk"
            test -s "dist/routerforge-admin_0.0.0-ci_${target}.ipk"
            test -s "dist/routerforge-dns_0.0.0-ci_${target}.ipk"
            test -s "dist/routerforge-system_0.0.0-ci_${target}.ipk"
          done

      - name: Smoke test monitoring runtime
        run: |
          go build -ldflags="-X main.version=0.0.0-ci" -o /tmp/routerforge-module ./modules/monitoring-runtime

          smoke_module() {
            id="$1"
            endpoint="$2"
            socket="/tmp/routerforge-${id}.sock"
            rm -f "$socket"
            /tmp/routerforge-module -module "$id" -socket "$socket" &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true; rm -f "$socket"' EXIT INT TERM

            i=0
            while [ ! -S "$socket" ] && [ "$i" -lt 30 ]; do
              sleep 0.1
              i=$((i + 1))
            done
            test -S "$socket"
            curl --fail --silent --show-error --unix-socket "$socket" http://unix/v1/health >/dev/null
            curl --fail --silent --show-error --unix-socket "$socket" "http://unix/v1/$endpoint" >/dev/null

            kill "$pid"
            wait "$pid" 2>/dev/null || true
            rm -f "$socket"
            trap - EXIT INT TERM
          }

          smoke_module system summary
          smoke_module thermal sensors
          smoke_module storage storage
          smoke_module network summary

      - name: Check shell scripts
        run: |
          sh -n components/core/packaging/S90routerforge
          sh -n components/control/packaging/S91routerforge-admin
          sh -n modules/dns/packaging/S91routerforge-dns
          sh -n modules/system/packaging/S92routerforge-system
          sh -n modules/thermal/packaging/S93routerforge-thermal
          sh -n modules/storage/packaging/S94routerforge-storage
          sh -n modules/network/packaging/S95routerforge-network
          sh -n scripts/target-env.sh
          sh -n scripts/install-repo.sh
          sh -n scripts/remove-repo.sh
          sh -n scripts/build-frontend.sh
          sh -n scripts/build-opkg.sh
          sh -n scripts/build-admin-opkg.sh
          sh -n scripts/upx-pack.sh
          sh -n scripts/build-modules-opkg.sh
          sh -n scripts/build-feed.sh
          sh -n components/core/packaging/postinst
          sh -n components/core/packaging/prerm
          sh -n components/control/packaging/postinst
          sh -n components/control/packaging/prerm
          sh -n modules/monitoring-runtime/packaging/postinst
          sh -n modules/monitoring-runtime/packaging/prerm
          sh -n modules/dns/packaging/postinst
          sh -n modules/dns/packaging/prerm
          sh -n modules/profiling/packaging/postinst
          sh -n modules/profiling/packaging/prerm

      - name: Build Entware package set
        if: steps.changes.outputs.expensive == 'true'
        run: |
          ./scripts/build-opkg.sh 0.0.0-ci
          ./scripts/build-admin-opkg.sh 0.0.0-ci
          ./scripts/build-modules-opkg.sh 0.0.0-ci

      - name: Verify Entware package containers
        if: steps.changes.outputs.expensive == 'true'
        run: |
          packages="
          dist/routerforge-core_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-dns_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-admin_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-system_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-thermal_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-storage_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-network_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-profiling_0.0.0-ci_aarch64-3.10.ipk
          "

          for pkg in $packages; do
            test -f "$pkg"
            tar -tzf "$pkg" | grep -qx './debian-binary'
            tar -tzf "$pkg" | grep -qx './control.tar.gz'
            tar -tzf "$pkg" | grep -qx './data.tar.gz'
          done

      - name: Verify Entware package payloads
        if: steps.changes.outputs.expensive == 'true'
        run: |
          tar -xzOf dist/routerforge-core_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge'
          tar -xzOf dist/routerforge-dns_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/etc/routerforge/dns.enabled'
          tar -xzOf dist/routerforge-admin_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-admin'
          tar -xzOf dist/routerforge-system_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-system'
          tar -xzOf dist/routerforge-thermal_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-thermal'
          tar -xzOf dist/routerforge-storage_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-storage'
          tar -xzOf dist/routerforge-network_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-network'
          tar -xzOf dist/routerforge-profiling_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/etc/routerforge/profiling.enabled'

      - name: Verify AArch64 production executables are UPX packed
        if: steps.changes.outputs.expensive == 'true'
        run: |
          set -eu

          TMP=/tmp/routerforge-upx-payload-check
          rm -rf "$TMP"
          mkdir -p "$TMP"

          verify_upx_payload() {
            package="$1"
            binary="$2"
            output="$TMP/$binary"

            tar -xzOf "$package" ./data.tar.gz |
              tar -xzOf - "./opt/bin/$binary" > "$output"

            test -s "$output"
            chmod 0755 "$output"
            upx -t "$output"
          }

          verify_upx_payload \
            dist/routerforge-core_0.0.0-ci_aarch64-3.10.ipk \
            routerforge

          verify_upx_payload \
            dist/routerforge-admin_0.0.0-ci_aarch64-3.10.ipk \
            routerforge-admin

          verify_upx_payload \
            dist/routerforge-dns_0.0.0-ci_aarch64-3.10.ipk \
            routerforge-dns

          verify_upx_payload \
            dist/routerforge-system_0.0.0-ci_aarch64-3.10.ipk \
            routerforge-system

          verify_upx_payload \
            dist/routerforge-thermal_0.0.0-ci_aarch64-3.10.ipk \
            routerforge-thermal

          verify_upx_payload \
            dist/routerforge-storage_0.0.0-ci_aarch64-3.10.ipk \
            routerforge-storage

          verify_upx_payload \
            dist/routerforge-network_0.0.0-ci_aarch64-3.10.ipk \
            routerforge-network

      - name: Verify Core runtime version injection
        if: steps.changes.outputs.expensive == 'true'
        run: |
          set -eu

          TMP=/tmp/routerforge-version-check
          rm -rf "$TMP"
          mkdir -p "$TMP"

          cp dist/opkg-work/data/opt/bin/routerforge "$TMP/routerforge"

          if upx -t "$TMP/routerforge" >/dev/null 2>&1; then
            upx -d "$TMP/routerforge"
          fi

          strings "$TMP/routerforge" | grep -q '0.0.0-ci'

      - name: Check RouterForge release tooling
        run: |
          sh -n scripts/build-module-opkg.sh
          python3 -m py_compile scripts/build_routerforge_channel.py scripts/merge_release_index.py scripts/render_release_notes.py scripts/render_bootstrap.py

          grep -Fq 'detect_mem_mib() {' scripts/render_bootstrap.py
          grep -Fq 'detect_swap_mib() {' scripts/render_bootstrap.py
          grep -Fq 'detect_cpu_cores() {' scripts/render_bootstrap.py
          grep -Fq 'hardware_preflight() {' scripts/render_bootstrap.py

          grep -Fq 'ПРЕДУПРЕЖДЕНИЕ: обнаружено 128 МБ ОЗУ или меньше.' scripts/render_bootstrap.py
          grep -Fq 'WARNING: 128 MiB of RAM or less detected.' scripts/render_bootstrap.py

          grep -Fq 'ПРЕДУПРЕЖДЕНИЕ: обнаружен одноядерный процессор.' scripts/render_bootstrap.py
          grep -Fq 'WARNING: single-core CPU detected.' scripts/render_bootstrap.py

          grep -Fq 'swap-раздел или swap-файл на USB-накопителе' scripts/render_bootstrap.py
          grep -Fq 'swap partition or swap file on USB storage' scripts/render_bootstrap.py

          python3 scripts/build_routerforge_channel.py \
            --config release/channels/beta.json \
            --dist dist

          python3 scripts/merge_release_index.py \
            --candidate dist/routerforge-beta-candidate-index.json \
            --previous /tmp/routerforge-no-previous-index.json \
            --output /tmp/routerforge-preflight-index.json \
            --changed-list /tmp/routerforge-preflight-changed.txt \
            --checksums /tmp/routerforge-preflight-SHA256SUMS

          python3 scripts/render_bootstrap.py \
            --channel beta \
            --final /tmp/routerforge-preflight-index.json \
            --output /tmp/routerforge-preflight-bootstrap.sh

          sh -n /tmp/routerforge-preflight-bootstrap.sh

      - name: Build RouterForge beta channel
        if: steps.changes.outputs.expensive == 'true' && (github.ref == 'refs/heads/dev' || github.base_ref == 'dev')
        run: |
          python3 scripts/build_routerforge_channel.py \
            --config release/channels/beta.json \
            --dist dist

      - name: Upload RouterForge beta candidate
        if: steps.changes.outputs.expensive == 'true' && (github.ref == 'refs/heads/dev' || github.base_ref == 'dev')
        uses: actions/upload-artifact@v4
        with:
          name: routerforge-beta-aarch64
          path: |
            dist/routerforge-*.ipk
            dist/routerforge-beta-candidate-index.json
          retention-days: 7

      - name: Publish RouterForge beta channel
        if: steps.changes.outputs.expensive == 'true' && (github.ref == 'refs/heads/dev' && github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=routerforge-beta
          INDEX=routerforge-beta-index.json
          PREVIOUS=/tmp/routerforge-beta-index.json
          FINAL=dist/$INDEX
          CHANGED=dist/routerforge-beta-changed-assets.txt
          SUMS=dist/routerforge-beta-SHA256SUMS
          BOOTSTRAP=dist/routerforge-beta-bootstrap.sh

          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

          rm -f "$PREVIOUS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -p "$INDEX" -D /tmp >/dev/null 2>&1 || true
          else
            gh release create "$TAG" \
              --prerelease \
              --latest=false \
              --title "RouterForge Beta" \
              --notes "RouterForge beta channel is being initialized."
          fi

          python3 scripts/merge_release_index.py \
            --candidate dist/routerforge-beta-candidate-index.json \
            --previous "$PREVIOUS" \
            --output "$FINAL" \
            --changed-list "$CHANGED" \
            --checksums "$SUMS"

          python3 scripts/render_bootstrap.py \
            --channel beta \
            --final "$FINAL" \
            --output "$BOOTSTRAP"
          sh -n "$BOOTSTRAP"

          NOTES=dist/routerforge-beta-release-notes.md
          python3 scripts/render_release_notes.py \
            --channel beta \
            --previous "$PREVIOUS" \
            --final "$FINAL" \
            --output "$NOTES" \
            --commit "$GITHUB_SHA"

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            gh release upload "$TAG" --clobber "dist/$asset"
          done < "$CHANGED"

          python3 - "$FINAL" > /tmp/routerforge-beta-current-assets.txt <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              doc = json.load(fh)
          for item in doc.get("components", []):
              asset = item.get("asset")
              if asset:
                  print(asset)
          PY

          gh release view "$TAG" --json assets --jq '.assets[].name' |
          while IFS= read -r asset; do
            case "$asset" in
              routerforge-*.ipk)
                if ! grep -Fxq "$asset" /tmp/routerforge-beta-current-assets.txt; then
                  gh release delete-asset "$TAG" "$asset" --yes
                fi
                ;;
            esac
          done

          gh release upload "$TAG" --clobber "$FINAL" "$SUMS" "$BOOTSTRAP"
          gh release edit "$TAG" \
            --prerelease \
            --title "RouterForge Beta" \
            --notes-file "$NOTES"

      - name: Build stable promotion candidate
        if: steps.changes.outputs.expensive == 'true' && (github.ref == 'refs/heads/dev' && github.event_name == 'push')
        run: |
          set -eu

          python3 scripts/build_routerforge_channel.py \
            --config release/channels/stable.json \
            --dist dist

          python3 - "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          dist = Path("dist")
          index = dist / "routerforge-stable-candidate-index.json"

          with index.open("r", encoding="utf-8") as fh:
              doc = json.load(fh)

          assert doc["schema_version"] == 1
          assert doc["channel"] == "stable"
          assert doc["target"] == "aarch64-3.10"
          assert doc["commit"] == sha

          components = doc.get("components") or []
          assert len(components) == 8

          for item in components:
              asset = item["asset"]
              expected = item["sha256"]
              path = dist / asset
              assert path.is_file(), f"missing {asset}"

              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == expected, (
                  f"{asset}: sha256 mismatch: {actual} != {expected}"
              )

          print("stable promotion candidate verified")
          PY

      - name: Upload stable promotion candidate
        if: steps.changes.outputs.expensive == 'true' && (github.ref == 'refs/heads/dev' && github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: routerforge-stable-promotion
          path: |
            dist/routerforge-*.ipk
            dist/routerforge-stable-candidate-index.json
          retention-days: 14

  publish_stable:
    name: Publish validated stable promotion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect expensive build changes
        id: changes
        shell: bash
        run: |
          set -eu

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          case "$BASE" in
            ""|0000000000000000000000000000000000000000)
              BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
              ;;
          esac

          git diff --name-only "$BASE" "$GITHUB_SHA" \
            > /tmp/routerforge-changed-files.txt

          cat /tmp/routerforge-changed-files.txt

          expensive=false

          while IFS= read -r path; do
            case "$path" in
              components/*|modules/*|marketplace/*|release/*|scripts/*|go.mod|go.sum|.github/workflows/ci.yml)
                expensive=true
                break
                ;;
            esac
          done < /tmp/routerforge-changed-files.txt

          echo "expensive=$expensive" >> "$GITHUB_OUTPUT"
          echo "Expensive build required: $expensive"

      - name: Find successful dev validation for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          RUNS=/tmp/routerforge-dev-runs.json

          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=dev \
            -f head_sha="$GITHUB_SHA" \
            -f event=push \
            -f status=success \
            -f per_page=20 \
            > "$RUNS"

          DEV_RUN_ID=$(
            python3 - "$RUNS" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          path, sha = sys.argv[1:3]

          with open(path, "r", encoding="utf-8") as fh:
              doc = json.load(fh)

          matches = [
              run for run in doc.get("workflow_runs", [])
              if run.get("head_sha") == sha
              and run.get("head_branch") == "dev"
              and run.get("event") == "push"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]

          if matches:
              print(matches[0]["id"])
          PY
          )

          if [ -z "$DEV_RUN_ID" ]; then
            echo "No successful dev CI run found for exact SHA $GITHUB_SHA" >&2
            exit 1
          fi

          echo "Validated dev run: $DEV_RUN_ID"
          echo "DEV_RUN_ID=$DEV_RUN_ID" >> "$GITHUB_ENV"

      - name: Download exact stable promotion artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          TMP=/tmp/routerforge-stable-promotion
          rm -rf "$TMP" dist
          mkdir -p "$TMP" dist

          gh run download "$DEV_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name routerforge-stable-promotion \
            --dir "$TMP"

          find "$TMP" -type f \
            \( -name 'routerforge-*.ipk' \
               -o -name 'routerforge-stable-candidate-index.json' \) \
            -exec cp '{}' dist/ \;

          test -s dist/routerforge-stable-candidate-index.json

      - name: Verify downloaded promotion candidate
        run: |
          set -eu

          python3 - "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          dist = Path("dist")
          index = dist / "routerforge-stable-candidate-index.json"

          with index.open("r", encoding="utf-8") as fh:
              doc = json.load(fh)

          assert doc["schema_version"] == 1
          assert doc["channel"] == "stable"
          assert doc["target"] == "aarch64-3.10"
          assert doc["commit"] == sha

          components = doc.get("components") or []
          assert len(components) == 8

          for item in components:
              asset = item["asset"]
              expected = item["sha256"]
              path = dist / asset

              assert path.is_file(), f"missing {asset}"

              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == expected, (
                  f"{asset}: sha256 mismatch: {actual} != {expected}"
              )

          print("downloaded stable candidate verified")
          PY

          for pkg in dist/routerforge-*.ipk; do
            test -s "$pkg"
            tar -tzf "$pkg" | grep -qx './debian-binary'
            tar -tzf "$pkg" | grep -qx './control.tar.gz'
            tar -tzf "$pkg" | grep -qx './data.tar.gz'
          done

      - name: Prepare and validate stable release locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          TAG=routerforge-stable
          INDEX=routerforge-stable-index.json
          PREVIOUS=/tmp/routerforge-stable-index.json
          FINAL=dist/$INDEX
          CHANGED=dist/routerforge-stable-changed-assets.txt
          SUMS=dist/routerforge-stable-SHA256SUMS
          BOOTSTRAP=dist/routerforge-stable-bootstrap.sh
          NOTES=dist/routerforge-stable-release-notes.md

          rm -f "$PREVIOUS"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" \
              -p "$INDEX" \
              -D /tmp >/dev/null 2>&1 || true
          fi

          python3 scripts/merge_release_index.py \
            --candidate dist/routerforge-stable-candidate-index.json \
            --previous "$PREVIOUS" \
            --output "$FINAL" \
            --changed-list "$CHANGED" \
            --checksums "$SUMS"

          python3 scripts/render_bootstrap.py \
            --channel stable \
            --final "$FINAL" \
            --output "$BOOTSTRAP"

          sh -n "$BOOTSTRAP"

          python3 scripts/render_release_notes.py \
            --channel stable \
            --previous "$PREVIOUS" \
            --final "$FINAL" \
            --output "$NOTES" \
            --commit "$GITHUB_SHA"

          test -s "$FINAL"
          test -s "$SUMS"
          test -s "$BOOTSTRAP"
          test -s "$NOTES"

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            test -s "dist/$asset"
          done < "$CHANGED"

          echo "All stable release inputs validated before remote mutation."

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          TAG=routerforge-stable
          INDEX=routerforge-stable-index.json
          FINAL=dist/$INDEX
          CHANGED=dist/routerforge-stable-changed-assets.txt
          SUMS=dist/routerforge-stable-SHA256SUMS
          BOOTSTRAP=dist/routerforge-stable-bootstrap.sh
          NOTES=dist/routerforge-stable-release-notes.md

          # From this point onward remote mutation is allowed.
          # All build/render/checksum/bootstrap validation has already passed.

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --latest \
              --title "RouterForge Stable" \
              --notes "RouterForge stable channel is being initialized."
          fi

          # Upload component assets first. The public index is still the old one
          # until every required package is already present.
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            gh release upload "$TAG" \
              --clobber \
              "dist/$asset"
          done < "$CHANGED"

          # Publish discovery metadata only after all referenced packages exist.
          gh release upload "$TAG" \
            --clobber \
            "$FINAL" \
            "$SUMS" \
            "$BOOTSTRAP"

          python3 - "$FINAL" > /tmp/routerforge-stable-current-assets.txt <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              doc = json.load(fh)

          for item in doc.get("components", []):
              asset = item.get("asset")
              if asset:
                  print(asset)
          PY

          gh release view "$TAG" --json assets --jq '.assets[].name' |
          while IFS= read -r asset; do
            case "$asset" in
              routerforge-*.ipk)
                if ! grep -Fxq \
                  "$asset" \
                  /tmp/routerforge-stable-current-assets.txt
                then
                  gh release delete-asset \
                    "$TAG" \
                    "$asset" \
                    --yes
                fi
                ;;
            esac
          done

          gh release edit "$TAG" \
            --latest \
            --title "RouterForge Stable" \
            --notes-file "$NOTES"

          # Move the rolling tag LAST.
          # A failure before this point cannot falsely mark an incomplete
          # publication as the current stable commit.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

          echo "Stable promotion complete: $GITHUB_SHA"
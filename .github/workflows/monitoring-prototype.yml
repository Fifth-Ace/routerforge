name: Monitoring Prototype

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/monitoring-prototype.yml'
      - 'modules/monitoring-runtime/**'
      - 'scripts/build-monitoring-prototype.sh'
      - 'scripts/target-env.sh'
      - 'scripts/upx-pack.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: true

      - name: Install pinned UPX
        shell: bash
        run: |
          set -eu
          UPX_VERSION=5.2.1
          UPX_ARCHIVE="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          UPX_SHA256="402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657"
          UPX_URL="https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_ARCHIVE}"

          curl --fail --silent --show-error --location \
            "$UPX_URL" \
            --output "/tmp/$UPX_ARCHIVE"

          printf '%s  %s\n' "$UPX_SHA256" "/tmp/$UPX_ARCHIVE" | sha256sum -c -

          rm -rf "/tmp/upx-${UPX_VERSION}-amd64_linux"
          tar -xJf "/tmp/$UPX_ARCHIVE" -C /tmp
          sudo install -m 0755 \
            "/tmp/upx-${UPX_VERSION}-amd64_linux/upx" \
            /usr/local/bin/upx

          test "$(upx --version | head -n 1)" = "upx 5.2.1"

      - name: Build ARM64 monitoring prototype IPK
        id: build
        shell: bash
        run: |
          set -eu
          VERSION=0.7.0-phase7b
          TARGET=aarch64-3.10

          ROUTERFORGE_TARGET="$TARGET" \
            sh ./scripts/build-monitoring-prototype.sh "$VERSION" | tee /tmp/routerforge-monitoring-build.log

          PACKAGE="dist/routerforge-monitoring_${VERSION}_${TARGET}.ipk"
          test -s "$PACKAGE"

          printf 'package=%s\n' "$PACKAGE" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'target=%s\n' "$TARGET" >> "$GITHUB_OUTPUT"

      - name: Verify prototype package contract
        shell: bash
        run: |
          set -eu
          PACKAGE='${{ steps.build.outputs.package }}'
          VERSION='${{ steps.build.outputs.version }}'
          TARGET='${{ steps.build.outputs.target }}'
          TMP=/tmp/routerforge-monitoring-package-check

          rm -rf "$TMP"
          mkdir -p "$TMP"

          test -s "$PACKAGE"
          tar -tzf "$PACKAGE" | grep -qx './debian-binary'
          tar -tzf "$PACKAGE" | grep -qx './control.tar.gz'
          tar -tzf "$PACKAGE" | grep -qx './data.tar.gz'

          tar -xzOf "$PACKAGE" ./control.tar.gz | tar -xzOf - ./control > "$TMP/control"
          grep -qx 'Package: routerforge-monitoring' "$TMP/control"
          grep -qx "Version: $VERSION" "$TMP/control"
          grep -qx "Architecture: $TARGET" "$TMP/control"
          grep -qx 'Depends: routerforge-core' "$TMP/control"

          tar -xzOf "$PACKAGE" ./data.tar.gz | tar -tzf - > "$TMP/payload.txt"
          grep -qx './opt/bin/routerforge-monitoring' "$TMP/payload.txt"
          grep -qx './opt/etc/init.d/S92routerforge-monitoring' "$TMP/payload.txt"
          grep -qx './opt/share/licenses/routerforge-monitoring/LICENSE' "$TMP/payload.txt"

          tar -xzOf "$PACKAGE" ./data.tar.gz | \
            tar -xzOf - ./opt/bin/routerforge-monitoring > "$TMP/routerforge-monitoring"
          chmod 0755 "$TMP/routerforge-monitoring"

          readelf -h "$TMP/routerforge-monitoring" | grep -Eq 'Machine:[[:space:]]+AArch64'
          upx -t "$TMP/routerforge-monitoring"

      - name: Prepare immutable hardware-test artifact
        shell: bash
        run: |
          set -eu
          PACKAGE='${{ steps.build.outputs.package }}'
          VERSION='${{ steps.build.outputs.version }}'
          TARGET='${{ steps.build.outputs.target }}'
          OUT=dist/monitoring-prototype-artifact
          FILE="$(basename "$PACKAGE")"

          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$PACKAGE" "$OUT/$FILE"

          SHA256="$(sha256sum "$OUT/$FILE" | awk '{print $1}')"
          BYTES="$(wc -c < "$OUT/$FILE" | tr -d ' ')"

          printf '%s  %s\n' "$SHA256" "$FILE" > "$OUT/SHA256SUMS"
          {
            printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA"
            printf 'PACKAGE=routerforge-monitoring\n'
            printf 'VERSION=%s\n' "$VERSION"
            printf 'TARGET=%s\n' "$TARGET"
            printf 'FILE=%s\n' "$FILE"
            printf 'BYTES=%s\n' "$BYTES"
            printf 'SHA256=%s\n' "$SHA256"
            printf 'PURPOSE=Phase 7B ARM64 hardware A/B prototype\n'
          } > "$OUT/BUILD-METADATA.txt"

          cat "$OUT/BUILD-METADATA.txt"
          sha256sum -c "$OUT/SHA256SUMS"

      - name: Upload ARM64 monitoring prototype
        uses: actions/upload-artifact@v4
        with:
          name: routerforge-monitoring-phase7b-${{ github.sha }}
          path: dist/monitoring-prototype-artifact/
          if-no-files-found: error
          retention-days: 14

services:
  collector:
    build: ..
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:18081:8000"
    volumes:
      - telemetry_data:/data
    environment:
      RF_ADMIN_PASSWORD: ${RF_ADMIN_PASSWORD:?Set a long random admin password in .env}
      RF_DB_PATH: /data/telemetry.sqlite
      RF_PORT: "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
volumes:
  telemetry_data:

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend build
        run: |
          test -f frontend/build/index.html
          test -d frontend/build/_app

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Verify embedded frontend build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags embed_frontend -o /tmp/dns-monitor-embed-check .
          test -s /tmp/dns-monitor-embed-check

      - name: Check shell scripts
        run: |
          sh -n package/install.sh
          sh -n package/uninstall.sh
          sh -n package/S90dns-monitor
          sh -n package/S91dns-monitor-admin
          sh -n scripts/install-repo.sh
          sh -n scripts/remove-repo.sh
          sh -n scripts/build-frontend.sh
          sh -n scripts/build-opkg.sh
          sh -n scripts/build-admin-opkg.sh
          sh -n scripts/build-feed.sh
          sh -n packaging/opkg/postinst
          sh -n packaging/opkg/prerm
          sh -n packaging/admin/postinst
          sh -n packaging/admin/prerm

      - name: Build Entware core package
        run: |
          ./scripts/build-opkg.sh 0.0.0-ci
          test -f dist/dns-monitor_0.0.0-ci_aarch64-3.10.ipk

      - name: Build Entware admin package
        run: |
          ./scripts/build-admin-opkg.sh 0.0.0-ci
          test -f dist/dns-monitor-admin_0.0.0-ci_aarch64-3.10.ipk

      - name: Verify Entware package containers
        run: |
          for pkg in \
            dist/dns-monitor_0.0.0-ci_aarch64-3.10.ipk \
            dist/dns-monitor-admin_0.0.0-ci_aarch64-3.10.ipk
          do
            tar -tzf "$pkg" | grep -qx './debian-binary'
            tar -tzf "$pkg" | grep -qx './control.tar.gz'
            tar -tzf "$pkg" | grep -qx './data.tar.gz'
          done

      - name: Build dev packages
        if: github.ref == 'refs/heads/dev'
        run: |
          ./scripts/build-opkg.sh 0.2.0 dev
          ./scripts/build-admin-opkg.sh 0.2.0 dev
          test -f dist/dns-monitor_0.2.0-dev_aarch64-3.10.ipk
          test -f dist/dns-monitor-admin_0.2.0-dev_aarch64-3.10.ipk

      - name: Upload dev packages
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: dns-monitor-0.2.0-dev-aarch64
          path: |
            dist/dns-monitor_0.2.0-dev_aarch64-3.10.ipk
            dist/dns-monitor-admin_0.2.0-dev_aarch64-3.10.ipk
          retention-days: 7

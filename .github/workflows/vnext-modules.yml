name: vNext Modules

on:
  push:
    branches: [dev]
    paths:
      - 'components/core/vnext_modules.go'
      - 'components/core/catalog.go'
      - 'components/core/vnext_catalog_test.go'
      - 'components/core/catalog_lifecycle_test.go'
      - 'components/core/frontend/src/lib/components/ModuleFrame.svelte'
      - 'components/core/frontend/src/routes/maintenance/**'
      - 'components/core/frontend/src/routes/network-tools/**'
      - 'components/core/frontend/src/routes/integrations/**'
      - 'components/core/frontend/src/routes/developer-tools/**'      - 'release/channels/dev.json'
      - 'scripts/build_routerforge_channel.py'
      - 'scripts/publish-dev.sh'
      - 'internal/platform/**'
      - 'modules/vnext-runtime/**'
      - 'modules/vnext-ui/**'
      - 'modules/maintenance/**'
      - 'modules/network-tools/**'
      - 'modules/integrations/**'
      - 'modules/developer-tools/**'
      - 'scripts/build-vnext-opkg.sh'
      - 'scripts/build-opkg.sh'
      - '.github/workflows/vnext-modules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify patch hygiene
        shell: bash
        run: |
          set -eu
          git diff --check HEAD^
          test -f components/core/vnext_modules.go
          test -f modules/vnext-runtime/main.go
          test -f modules/vnext-ui/runtime.js
          test -f modules/maintenance/frontend/index.html
          test -f modules/network-tools/frontend/index.html
          test -f modules/integrations/frontend/index.html
          test -f modules/developer-tools/frontend/index.html
          test -x scripts/build-vnext-opkg.sh
          grep -Fxq 'vnext_modules.go' scripts/build-opkg.sh
          python3 - <<'PY'
          import json

          with open("release/channels/dev.json", "r", encoding="utf-8") as fh:
              doc = json.load(fh)

          expected = [
              "routerforge-core",
              "dns",
              "admin",
              "monitoring",
              "maintenance",
              "network-tools",
              "integrations",
              "developer-tools",
              "profiling",
          ]
          actual = [item.get("id") for item in doc.get("components", [])]
          if actual != expected:
              raise SystemExit(f"unexpected Dev component order: {actual!r}")
          if doc.get("release_version") != "0.8.0~dev":
              raise SystemExit(f"unexpected Dev release train: {doc.get('release_version')!r}")
          print("DEV_APP_CENTER_COMPONENT_CONFIG=PASS")
          PY
          grep -Fq 'VERSION="0.8.0~dev.r${GITHUB_RUN_NUMBER}.${SHORT_SHA}"' scripts/publish-dev.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: true

      - name: Verify Go formatting
        shell: bash
        run: |
          set -eu
          unformatted="$(gofmt -l components/core/vnext_modules.go components/core/catalog.go components/core/vnext_catalog_test.go components/core/catalog_lifecycle_test.go internal/platform modules/vnext-runtime)"
          test -z "$unformatted" || {
            printf 'gofmt required:\n%s\n' "$unformatted" >&2
            exit 1
          }

      - name: Test shared engines and vNext runtime
        run: go test ./components/core ./internal/platform/... ./modules/vnext-runtime

      - name: Vet shared engines and vNext runtime
        run: go vet ./internal/platform/... ./modules/vnext-runtime

      - name: Cross-build ARM64 vNext runtime
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -trimpath \
            -ldflags='-s -w -X main.version=0.0.0-ci' \
            -o /tmp/routerforge-vnext-arm64 ./modules/vnext-runtime
          test -s /tmp/routerforge-vnext-arm64

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Validate static module UI
        shell: bash
        run: |
          set -eu
          node --check modules/vnext-ui/runtime.js
          for file in \
            modules/maintenance/frontend/app.js \
            modules/network-tools/frontend/app.js \
            modules/integrations/frontend/app.js \
            modules/developer-tools/frontend/app.js
          do
            node --check "$file"
          done
          grep -q 'Network Doctor' modules/network-tools/frontend/index.html
          grep -q 'Config Vault' modules/maintenance/frontend/index.html
          grep -q 'NFQWS2 Manager' modules/integrations/frontend/index.html
          grep -q 'Module ABI' modules/developer-tools/frontend/index.html
          grep -q 'existing guarded Admin backend' modules/maintenance/frontend/index.html
          grep -q 'Classic diagnostics' modules/network-tools/frontend/index.html
          grep -q 'canonical Core catalog' modules/integrations/frontend/index.html
          grep -q 'Developer Tools runtime' modules/developer-tools/frontend/index.html
          grep -q 'routerforge-module-height' components/core/frontend/src/lib/components/ModuleFrame.svelte
          grep -q 'moduleId="maintenance"' components/core/frontend/src/routes/maintenance/+page.svelte
          grep -q 'moduleId="network-tools"' components/core/frontend/src/routes/network-tools/+page.svelte
          grep -q 'moduleId="integrations"' components/core/frontend/src/routes/integrations/+page.svelte
          grep -q 'moduleId="developer-tools"' components/core/frontend/src/routes/developer-tools/+page.svelte
      - name: Validate shell packaging
        shell: bash
        run: |
          set -eu
          sh -n scripts/build-vnext-opkg.sh
          sh -n modules/vnext-runtime/packaging/postinst
          sh -n modules/vnext-runtime/packaging/prerm
          for file in \
            modules/maintenance/packaging/S96routerforge-maintenance \
            modules/network-tools/packaging/S97routerforge-network-tools \
            modules/integrations/packaging/S98routerforge-integrations \
            modules/developer-tools/packaging/S99routerforge-developer-tools
          do
            sh -n "$file"
          done

      - name: Smoke test Unix-socket modules
        shell: bash
        run: |
          set -eu
          go build -trimpath -ldflags='-X main.version=0.0.0-ci' -o /tmp/routerforge-vnext ./modules/vnext-runtime

          smoke() {
            id="$1"
            ui="$2"
            socket="/tmp/routerforge-${id}.sock"
            rm -f "$socket"
            /tmp/routerforge-vnext -module "$id" -socket "$socket" -ui "$ui" &
            pid=$!
            i=0
            while [ ! -S "$socket" ] && [ "$i" -lt 40 ]; do
              sleep 0.1
              i=$((i + 1))
            done
            test -S "$socket"
            curl --fail --silent --show-error --unix-socket "$socket" http://unix/v1/health | grep -q '"ok":true'
            curl --fail --silent --show-error --unix-socket "$socket" http://unix/v1/summary >/dev/null
            curl --fail --silent --show-error --unix-socket "$socket" http://unix/v1/ui/index.html >/dev/null
            kill "$pid"
            wait "$pid" 2>/dev/null || true
            rm -f "$socket"
          }

          smoke maintenance modules/maintenance/frontend
          smoke network-tools modules/network-tools/frontend
          smoke integrations modules/integrations/frontend
          smoke developer-tools modules/developer-tools/frontend

      - name: Build ARM64 vNext IPKs
        id: package
        shell: bash
        env:
          ROUTERFORGE_TARGET: aarch64-3.10
          ROUTERFORGE_UPX: '0'
        run: |
          set -eu
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          VERSION="0.8.0~dev.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          ./scripts/build-vnext-opkg.sh "$VERSION"

          for package in \
            routerforge-maintenance \
            routerforge-network-tools \
            routerforge-integrations \
            routerforge-developer-tools
          do
            file="dist/${package}_${VERSION}_aarch64-3.10.ipk"
            test -s "$file"
            actual_arch="$(tar -xzOf "$file" ./control.tar.gz | tar -xzOf - ./control | awk -F ': *' '$1 == "Architecture" {print $2; exit}')"
            actual_name="$(tar -xzOf "$file" ./control.tar.gz | tar -xzOf - ./control | awk -F ': *' '$1 == "Package" {print $2; exit}')"
            test "$actual_arch" = 'aarch64-3.10'
            test "$actual_name" = "$package"
          done

          sha256sum \
            dist/routerforge-maintenance_"$VERSION"_aarch64-3.10.ipk \
            dist/routerforge-network-tools_"$VERSION"_aarch64-3.10.ipk \
            dist/routerforge-integrations_"$VERSION"_aarch64-3.10.ipk \
            dist/routerforge-developer-tools_"$VERSION"_aarch64-3.10.ipk \
            | tee dist/VNEXT_SHA256SUMS.txt
          printf 'SHA=%s\nVERSION=%s\n' "$GITHUB_SHA" "$VERSION" | tee dist/VNEXT_BUILD_INFO.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload ARM64 vNext module artifact
        uses: actions/upload-artifact@v4
        with:
          name: routerforge-vnext-modules-${{ github.run_number }}
          path: |
            dist/routerforge-maintenance_*.ipk
            dist/routerforge-network-tools_*.ipk
            dist/routerforge-integrations_*.ipk
            dist/routerforge-developer-tools_*.ipk
            dist/VNEXT_SHA256SUMS.txt
            dist/VNEXT_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

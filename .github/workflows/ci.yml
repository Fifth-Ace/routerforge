name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install frontend dependencies
        working-directory: components/core/frontend
        run: npm install --no-audit --no-fund

      - name: Check frontend
        working-directory: components/core/frontend
        run: npm run check

      - name: Build frontend
        working-directory: components/core/frontend
        run: npm run build

      - name: Verify frontend build
        run: |
          test -f components/core/frontend/build/index.html
          test -d components/core/frontend/build/_app
          test -f components/core/frontend/build/favicon.ico
          test -f components/core/frontend/build/routerforge-mark.png

      - name: Install DNS frontend dependencies
        working-directory: modules/dns/frontend
        run: npm install --no-audit --no-fund

      - name: Build DNS frontend
        working-directory: modules/dns/frontend
        run: npm run build

      - name: Verify DNS frontend build
        run: test -f modules/dns/frontend/build/index.html

      - name: Validate RouterForge registry
        run: python3 marketplace/build_registry.py --check

      - name: Verify repository layout
        run: |
          test -z "$(find . -maxdepth 1 -type f -name '*.go' -print)"
          test ! -d cmd
          test ! -d frontend
          test ! -d packaging
          test -f components/core/main.go
          test -f components/control/main.go
          test -f modules/dns/runtime/dns_module_main.go
          test -f modules/dns/frontend/DNSModuleApp.svelte
          test -f modules/monitoring-runtime/main.go
          test -f modules/system/packaging/S92routerforge-system
          test -f modules/thermal/packaging/S93routerforge-thermal
          test -f modules/storage/packaging/S94routerforge-storage
          test -f modules/network/packaging/S95routerforge-network
          test -f release/channels/beta.json
          test -f release/channels/stable.json
          test -f docs/REPOSITORY_LAYOUT.md


      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Verify embedded frontend build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -tags embed_frontend \
            -ldflags="-X main.version=0.0.0-ci" \
            -o /tmp/routerforge-embed-check ./components/core
          test -s /tmp/routerforge-embed-check

      - name: Verify monitoring provider cross-build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-X main.version=0.0.0-ci" \
            -o /tmp/routerforge-module-arm64 ./modules/monitoring-runtime
          test -s /tmp/routerforge-module-arm64

      - name: Verify planned MIPS build targets
        run: |
          set -eu
          for target in mips-3.4 mipsel-3.4; do
            ROUTERFORGE_TARGET="$target" ./scripts/build-opkg.sh 0.0.0-ci
            ROUTERFORGE_TARGET="$target" ./scripts/build-admin-opkg.sh 0.0.0-ci
            ROUTERFORGE_TARGET="$target" ./scripts/build-module-opkg.sh dns 0.0.0-ci
            ROUTERFORGE_TARGET="$target" ./scripts/build-module-opkg.sh system 0.0.0-ci

            test -s "dist/routerforge-core_0.0.0-ci_${target}.ipk"
            test -s "dist/routerforge-admin_0.0.0-ci_${target}.ipk"
            test -s "dist/routerforge-dns_0.0.0-ci_${target}.ipk"
            test -s "dist/routerforge-system_0.0.0-ci_${target}.ipk"
          done

      - name: Smoke test monitoring runtime
        run: |
          go build -ldflags="-X main.version=0.0.0-ci" -o /tmp/routerforge-module ./modules/monitoring-runtime

          smoke_module() {
            id="$1"
            endpoint="$2"
            socket="/tmp/routerforge-${id}.sock"
            rm -f "$socket"
            /tmp/routerforge-module -module "$id" -socket "$socket" &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true; rm -f "$socket"' EXIT INT TERM

            i=0
            while [ ! -S "$socket" ] && [ "$i" -lt 30 ]; do
              sleep 0.1
              i=$((i + 1))
            done
            test -S "$socket"
            curl --fail --silent --show-error --unix-socket "$socket" http://unix/v1/health >/dev/null
            curl --fail --silent --show-error --unix-socket "$socket" "http://unix/v1/$endpoint" >/dev/null

            kill "$pid"
            wait "$pid" 2>/dev/null || true
            rm -f "$socket"
            trap - EXIT INT TERM
          }

          smoke_module system summary
          smoke_module thermal sensors
          smoke_module storage storage
          smoke_module network summary

      - name: Check shell scripts
        run: |
          sh -n components/core/packaging/S90routerforge
          sh -n components/control/packaging/S91routerforge-admin
          sh -n modules/dns/packaging/S91routerforge-dns
          sh -n modules/system/packaging/S92routerforge-system
          sh -n modules/thermal/packaging/S93routerforge-thermal
          sh -n modules/storage/packaging/S94routerforge-storage
          sh -n modules/network/packaging/S95routerforge-network
          sh -n scripts/target-env.sh
          sh -n scripts/install-repo.sh
          sh -n scripts/remove-repo.sh
          sh -n scripts/build-frontend.sh
          sh -n scripts/build-opkg.sh
          sh -n scripts/build-admin-opkg.sh
          sh -n scripts/build-modules-opkg.sh
          sh -n scripts/build-feed.sh
          sh -n components/core/packaging/postinst
          sh -n components/core/packaging/prerm
          sh -n components/control/packaging/postinst
          sh -n components/control/packaging/prerm
          sh -n modules/monitoring-runtime/packaging/postinst
          sh -n modules/monitoring-runtime/packaging/prerm
          sh -n modules/dns/packaging/postinst
          sh -n modules/dns/packaging/prerm
          sh -n modules/profiling/packaging/postinst
          sh -n modules/profiling/packaging/prerm

      - name: Build Entware package set
        run: |
          ./scripts/build-opkg.sh 0.0.0-ci
          ./scripts/build-admin-opkg.sh 0.0.0-ci
          ./scripts/build-modules-opkg.sh 0.0.0-ci

      - name: Verify Entware package containers
        run: |
          packages="
          dist/routerforge-core_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-dns_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-admin_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-system_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-thermal_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-storage_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-network_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-profiling_0.0.0-ci_aarch64-3.10.ipk
          "

          for pkg in $packages; do
            test -f "$pkg"
            tar -tzf "$pkg" | grep -qx './debian-binary'
            tar -tzf "$pkg" | grep -qx './control.tar.gz'
            tar -tzf "$pkg" | grep -qx './data.tar.gz'
          done

      - name: Verify Entware package payloads
        run: |
          tar -xzOf dist/routerforge-core_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge'
          tar -xzOf dist/routerforge-dns_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/etc/routerforge/dns.enabled'
          tar -xzOf dist/routerforge-admin_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-admin'
          tar -xzOf dist/routerforge-system_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-system'
          tar -xzOf dist/routerforge-thermal_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-thermal'
          tar -xzOf dist/routerforge-storage_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-storage'
          tar -xzOf dist/routerforge-network_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-network'
          tar -xzOf dist/routerforge-profiling_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/etc/routerforge/profiling.enabled'

      - name: Verify Core runtime version injection
        run: |
          strings dist/opkg-work/data/opt/bin/routerforge | grep -q '0.0.0-ci'

      - name: Check RouterForge release tooling
        run: |
          sh -n scripts/build-module-opkg.sh
          python3 -m py_compile scripts/build_routerforge_channel.py scripts/merge_release_index.py scripts/render_release_notes.py scripts/render_bootstrap.py

      - name: Build RouterForge beta channel
        if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
        run: |
          python3 scripts/build_routerforge_channel.py \
            --config release/channels/beta.json \
            --dist dist

      - name: Upload RouterForge beta candidate
        if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: routerforge-beta-aarch64
          path: |
            dist/routerforge-*.ipk
            dist/routerforge-beta-candidate-index.json
          retention-days: 7

      - name: Publish RouterForge beta channel
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=routerforge-beta
          INDEX=routerforge-beta-index.json
          PREVIOUS=/tmp/routerforge-beta-index.json
          FINAL=dist/$INDEX
          CHANGED=dist/routerforge-beta-changed-assets.txt
          SUMS=dist/routerforge-beta-SHA256SUMS
          BOOTSTRAP=dist/routerforge-beta-bootstrap.sh

          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

          rm -f "$PREVIOUS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -p "$INDEX" -D /tmp >/dev/null 2>&1 || true
          else
            gh release create "$TAG" \
              --prerelease \
              --latest=false \
              --title "RouterForge Beta" \
              --notes "RouterForge beta channel is being initialized."
          fi

          python3 scripts/merge_release_index.py \
            --candidate dist/routerforge-beta-candidate-index.json \
            --previous "$PREVIOUS" \
            --output "$FINAL" \
            --changed-list "$CHANGED" \
            --checksums "$SUMS"

          python3 scripts/render_bootstrap.py \
            --channel beta \
            --final "$FINAL" \
            --output "$BOOTSTRAP"
          sh -n "$BOOTSTRAP"

          NOTES=dist/routerforge-beta-release-notes.md
          python3 scripts/render_release_notes.py \
            --channel beta \
            --previous "$PREVIOUS" \
            --final "$FINAL" \
            --output "$NOTES" \
            --commit "$GITHUB_SHA"

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            gh release upload "$TAG" --clobber "dist/$asset"
          done < "$CHANGED"

          python3 - "$FINAL" > /tmp/routerforge-beta-current-assets.txt <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              doc = json.load(fh)
          for item in doc.get("components", []):
              asset = item.get("asset")
              if asset:
                  print(asset)
          PY

          gh release view "$TAG" --json assets --jq '.assets[].name' |
          while IFS= read -r asset; do
            case "$asset" in
              routerforge-*.ipk)
                if ! grep -Fxq "$asset" /tmp/routerforge-beta-current-assets.txt; then
                  gh release delete-asset "$TAG" "$asset" --yes
                fi
                ;;
            esac
          done

          gh release upload "$TAG" --clobber "$FINAL" "$SUMS" "$BOOTSTRAP"
          gh release edit "$TAG" \
            --prerelease \
            --title "RouterForge Beta" \
            --notes-file "$NOTES"

      - name: Build RouterForge stable channel
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          python3 scripts/build_routerforge_channel.py \
            --config release/channels/stable.json \
            --dist dist

      - name: Upload RouterForge stable candidate
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: routerforge-stable-aarch64
          path: |
            dist/routerforge-*.ipk
            dist/routerforge-stable-candidate-index.json
          retention-days: 14

      - name: Publish RouterForge stable channel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=routerforge-stable
          INDEX=routerforge-stable-index.json
          PREVIOUS=/tmp/routerforge-stable-index.json
          FINAL=dist/$INDEX
          CHANGED=dist/routerforge-stable-changed-assets.txt
          SUMS=dist/routerforge-stable-SHA256SUMS
          BOOTSTRAP=dist/routerforge-stable-bootstrap.sh

          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

          rm -f "$PREVIOUS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -p "$INDEX" -D /tmp >/dev/null 2>&1 || true
          else
            gh release create "$TAG" \
              --latest \
              --title "RouterForge Stable" \
              --notes "RouterForge stable channel is being initialized."
          fi

          python3 scripts/merge_release_index.py \
            --candidate dist/routerforge-stable-candidate-index.json \
            --previous "$PREVIOUS" \
            --output "$FINAL" \
            --changed-list "$CHANGED" \
            --checksums "$SUMS"

          python3 scripts/render_bootstrap.py \
            --channel stable \
            --final "$FINAL" \
            --output "$BOOTSTRAP"
          sh -n "$BOOTSTRAP"

          NOTES=dist/routerforge-stable-release-notes.md
          python3 scripts/render_release_notes.py \
            --channel stable \
            --previous "$PREVIOUS" \
            --final "$FINAL" \
            --output "$NOTES" \
            --commit "$GITHUB_SHA"

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            gh release upload "$TAG" --clobber "dist/$asset"
          done < "$CHANGED"

          python3 - "$FINAL" > /tmp/routerforge-stable-current-assets.txt <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              doc = json.load(fh)
          for item in doc.get("components", []):
              asset = item.get("asset")
              if asset:
                  print(asset)
          PY

          gh release view "$TAG" --json assets --jq '.assets[].name' |
          while IFS= read -r asset; do
            case "$asset" in
              routerforge-*.ipk)
                if ! grep -Fxq "$asset" /tmp/routerforge-stable-current-assets.txt; then
                  gh release delete-asset "$TAG" "$asset" --yes
                fi
                ;;
            esac
          done

          gh release upload "$TAG" --clobber "$FINAL" "$SUMS" "$BOOTSTRAP"

          # One-time migration cleanup: the old dev rolling release predates beta/stable channels.
          if gh release view routerforge-dev >/dev/null 2>&1; then
            gh release delete routerforge-dev --cleanup-tag --yes
          fi

          gh release edit "$TAG" \
            --latest \
            --title "RouterForge Stable" \
            --notes-file "$NOTES"

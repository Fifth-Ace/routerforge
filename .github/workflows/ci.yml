name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend build
        run: |
          test -f frontend/build/index.html
          test -d frontend/build/_app
          test -f frontend/build/favicon.ico
          test -f frontend/build/routerforge-mark.png

      - name: Validate RouterForge registry
        run: python3 marketplace/build_registry.py --check

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Verify embedded frontend build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -tags embed_frontend \
            -ldflags="-X main.version=0.0.0-ci" \
            -o /tmp/routerforge-embed-check .
          test -s /tmp/routerforge-embed-check

      - name: Verify monitoring provider cross-build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-X main.version=0.0.0-ci" \
            -o /tmp/routerforge-module-arm64 ./cmd/dns-monitor-module
          test -s /tmp/routerforge-module-arm64

      - name: Smoke test monitoring runtime
        run: |
          go build -ldflags="-X main.version=0.0.0-ci" -o /tmp/routerforge-module ./cmd/dns-monitor-module

          smoke_module() {
            id="$1"
            endpoint="$2"
            socket="/tmp/routerforge-${id}.sock"
            rm -f "$socket"
            /tmp/routerforge-module -module "$id" -socket "$socket" &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true; rm -f "$socket"' EXIT INT TERM

            i=0
            while [ ! -S "$socket" ] && [ "$i" -lt 30 ]; do
              sleep 0.1
              i=$((i + 1))
            done
            test -S "$socket"
            curl --fail --silent --show-error --unix-socket "$socket" http://unix/v1/health >/dev/null
            curl --fail --silent --show-error --unix-socket "$socket" "http://unix/v1/$endpoint" >/dev/null

            kill "$pid"
            wait "$pid" 2>/dev/null || true
            rm -f "$socket"
            trap - EXIT INT TERM
          }

          smoke_module system summary
          smoke_module thermal sensors
          smoke_module storage storage
          smoke_module network summary

      - name: Check shell scripts
        run: |
          sh -n package/install.sh
          sh -n package/uninstall.sh
          sh -n package/S90routerforge
          sh -n package/S91routerforge-admin
          sh -n package/modules/S92routerforge-system
          sh -n package/modules/S93routerforge-thermal
          sh -n package/modules/S94routerforge-storage
          sh -n package/modules/S95routerforge-network
          sh -n scripts/install-repo.sh
          sh -n scripts/remove-repo.sh
          sh -n scripts/build-frontend.sh
          sh -n scripts/build-opkg.sh
          sh -n scripts/build-admin-opkg.sh
          sh -n scripts/build-modules-opkg.sh
          sh -n scripts/build-feed.sh
          sh -n packaging/opkg/postinst
          sh -n packaging/opkg/prerm
          sh -n packaging/admin/postinst
          sh -n packaging/admin/prerm
          sh -n packaging/modules/postinst
          sh -n packaging/modules/prerm
          sh -n packaging/modules/dns.postinst
          sh -n packaging/modules/dns.prerm
          sh -n packaging/modules/profiling.postinst
          sh -n packaging/modules/profiling.prerm

      - name: Build Entware package set
        run: |
          ./scripts/build-opkg.sh 0.0.0-ci
          ./scripts/build-admin-opkg.sh 0.0.0-ci
          ./scripts/build-modules-opkg.sh 0.0.0-ci

      - name: Verify Entware package containers
        run: |
          packages="
          dist/routerforge-core_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-dns_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-admin_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-system_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-thermal_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-storage_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-network_0.0.0-ci_aarch64-3.10.ipk
          dist/routerforge-profiling_0.0.0-ci_aarch64-3.10.ipk
          "

          for pkg in $packages; do
            test -f "$pkg"
            tar -tzf "$pkg" | grep -qx './debian-binary'
            tar -tzf "$pkg" | grep -qx './control.tar.gz'
            tar -tzf "$pkg" | grep -qx './data.tar.gz'
          done

      - name: Verify Entware package payloads
        run: |
          tar -xzOf dist/routerforge-core_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge'
          tar -xzOf dist/routerforge-dns_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/etc/routerforge/dns.enabled'
          tar -xzOf dist/routerforge-admin_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-admin'
          tar -xzOf dist/routerforge-system_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-system'
          tar -xzOf dist/routerforge-thermal_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-thermal'
          tar -xzOf dist/routerforge-storage_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-storage'
          tar -xzOf dist/routerforge-network_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/bin/routerforge-network'
          tar -xzOf dist/routerforge-profiling_0.0.0-ci_aarch64-3.10.ipk ./data.tar.gz | tar -tzf - | grep -qx './opt/etc/routerforge/profiling.enabled'

      - name: Verify Core runtime version injection
        run: |
          strings dist/opkg-work/data/opt/bin/routerforge | grep -q '0.0.0-ci'

      - name: Build RouterForge beta package set
        if: github.ref == 'refs/heads/dev'
        run: |
          ./scripts/build-opkg.sh 0.3.0 beta
          ./scripts/build-admin-opkg.sh 0.3.0 beta
          ./scripts/build-modules-opkg.sh 0.3.0 beta

          assets="
          dist/routerforge-core_0.3.0-beta_aarch64-3.10.ipk
          dist/routerforge-dns_0.3.0-beta_aarch64-3.10.ipk
          dist/routerforge-admin_0.3.0-beta_aarch64-3.10.ipk
          dist/routerforge-system_0.3.0-beta_aarch64-3.10.ipk
          dist/routerforge-thermal_0.3.0-beta_aarch64-3.10.ipk
          dist/routerforge-storage_0.3.0-beta_aarch64-3.10.ipk
          dist/routerforge-network_0.3.0-beta_aarch64-3.10.ipk
          dist/routerforge-profiling_0.3.0-beta_aarch64-3.10.ipk
          "
          for asset in $assets; do test -f "$asset"; done
          sha256sum $assets | sed 's#dist/##' > dist/routerforge-beta-SHA256SUMS

      - name: Upload RouterForge beta package set
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: routerforge-0.3.0-beta-aarch64
          path: |
            dist/routerforge-core_0.3.0-beta_aarch64-3.10.ipk
            dist/routerforge-dns_0.3.0-beta_aarch64-3.10.ipk
            dist/routerforge-admin_0.3.0-beta_aarch64-3.10.ipk
            dist/routerforge-system_0.3.0-beta_aarch64-3.10.ipk
            dist/routerforge-thermal_0.3.0-beta_aarch64-3.10.ipk
            dist/routerforge-storage_0.3.0-beta_aarch64-3.10.ipk
            dist/routerforge-network_0.3.0-beta_aarch64-3.10.ipk
            dist/routerforge-profiling_0.3.0-beta_aarch64-3.10.ipk
            dist/routerforge-beta-SHA256SUMS
          retention-days: 7

      - name: Publish rolling RouterForge beta release
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f routerforge-beta "$GITHUB_SHA"
          git push --force origin refs/tags/routerforge-beta

          if ! gh release view routerforge-beta >/dev/null 2>&1; then
            gh release create routerforge-beta \
              --prerelease \
              --title "RouterForge beta packages" \
              --notes "Rolling RouterForge beta channel. Assets are replaced after every green dev build."
          fi

          gh release upload routerforge-beta --clobber \
            dist/routerforge-core_0.3.0-beta_aarch64-3.10.ipk \
            dist/routerforge-dns_0.3.0-beta_aarch64-3.10.ipk \
            dist/routerforge-admin_0.3.0-beta_aarch64-3.10.ipk \
            dist/routerforge-system_0.3.0-beta_aarch64-3.10.ipk \
            dist/routerforge-thermal_0.3.0-beta_aarch64-3.10.ipk \
            dist/routerforge-storage_0.3.0-beta_aarch64-3.10.ipk \
            dist/routerforge-network_0.3.0-beta_aarch64-3.10.ipk \
            dist/routerforge-profiling_0.3.0-beta_aarch64-3.10.ipk \
            dist/routerforge-beta-SHA256SUMS

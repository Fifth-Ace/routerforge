name: DPI Detector Companion Prototype

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact RouterForge dev SHA to build from
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: routerforge-dpi-detector-companion
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish ARM64 companion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dispatched dev source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail

          actual="$(git rev-parse HEAD)"
          expected="${{ inputs.expected_sha }}"

          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha is not a full lowercase SHA" >&2
            exit 1
          fi

          if [ "$actual" != "$expected" ]; then
            echo "workflow source SHA mismatch: actual=$actual expected=$expected" >&2
            exit 1
          fi

          echo "D1P1_EXACT_SOURCE_SHA=PASS"
          echo "D1P1_SOURCE_SHA=$actual"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build companion IPK
        shell: bash
        run: |
          set -euo pipefail

          short="$(printf '%.12s' "$GITHUB_SHA")"
          version="4.2.4~rf.d1p1.r${GITHUB_RUN_NUMBER}.${short}"

          ROUTERFORGE_DPI_PACKAGE_VERSION="$version" \
            sh scripts/build-dpi-detector-companion.sh

          asset_version="${version//\~/-}"
          asset="routerforge-dpi-detector_${asset_version}_aarch64-3.10.ipk"

          test -s "dist/$asset"

          echo "D1P1_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "D1P1_ASSET=$asset" >> "$GITHUB_ENV"

      - name: Verify companion package contract
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/verify-dpi-detector-companion.sh "dist/$D1P1_ASSET"

      - name: Upload companion CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: routerforge-dpi-detector-companion-${{ github.sha }}
          path: dist/${{ env.D1P1_ASSET }}
          retention-days: 14

      - name: Publish dedicated companion prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag='routerforge-dpi-detector-dev'
          asset_path="dist/$D1P1_ASSET"
          local_sha="$(sha256sum "$asset_path" | awk '{print $1}')"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "RouterForge DPI Detector Companion Dev" \
              --notes "Experimental ARM64 Entware companion for RouterForge D1/D2 hardware validation. Not part of the RouterForge channel index."
          fi

          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            "$asset_path"

          remote_digest="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq ".assets[] | select(.name == \"$D1P1_ASSET\") | .digest"
          )"

          if [ "$remote_digest" != "sha256:$local_sha" ]; then
            echo "remote companion digest mismatch: $remote_digest" >&2
            exit 1
          fi

          patched="$(
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" \
              -F force=true \
              --jq '.object.sha'
          )"

          if [ "$patched" != "$GITHUB_SHA" ]; then
            echo "companion tag SHA mismatch: $patched" >&2
            exit 1
          fi

          echo "D1P1_COMPANION_PUBLISH=PASS"
          echo "D1P1_ASSET=$D1P1_ASSET"
          echo "D1P1_ASSET_SHA256=$local_sha"